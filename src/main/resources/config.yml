      breed-cooldown-increase: 100
      grow-up-time-increase:   100

    horse:
      breed-cooldown-increase: 200   # 15-minute cooldown (triple)
      grow-up-time-increase:   200   # 60-minute grow-up (triple)

    donkey:
      breed-cooldown-increase: 200
      grow-up-time-increase:   200

